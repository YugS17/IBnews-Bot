name: test-pushover

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Send test Pushover notifications
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_MA_TOKEN: ${{ secrets.PUSHOVER_MA_TOKEN }}
          PUSHOVER_INDUSTRIALS_TOKEN: ${{ secrets.PUSHOVER_INDUSTRIALS_TOKEN }}
        run: python -u test_pushover.py
