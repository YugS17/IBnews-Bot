name: news-bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_MA_TOKEN: ${{ secrets.PUSHOVER_MA_TOKEN }}
          PUSHOVER_INDUSTRIALS_TOKEN: ${{ secrets.PUSHOVER_INDUSTRIALS_TOKEN }}
        run: python main.py

      - name: Commit updated state file
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/seen_articles.json
          git diff --staged --quiet || git commit -m "Update seen articles state"
          git push
